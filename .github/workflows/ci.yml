name: CI

on:
  push:
    branches:
      - master  # Ejecuta pruebas al hacer push en la rama 'master'
  pull_request:  # Revisa los cambios antes de integrarlos

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # make crea el entorno (venv) con el Python instalado en el paso anterior
      - name: Run ruff, mypy and pyright
        run: make check PYTHON=python

  test:
    # Las pruebas usan la API real con los secretos del repositorio, que no
    # están disponibles en los pull requests desde forks.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']  # Versión mínima soportada (requires-python)

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}  # Configura la versión de Python desde la matriz

      - name: Display Python version
        run: python --version

      # make crea el entorno (venv) con el paquete y el grupo dev de
      # pyproject.toml, y falla si falla alguna prueba
      - name: Run Python tests
        env:
          LIBREDTE_HASH: ${{ secrets.LIBREDTE_HASH }}
          LIBREDTE_RUT: ${{ vars.LIBREDTE_RUT }}
        run: make tests-readonly PYTHON=python
